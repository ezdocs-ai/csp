<div class="p-4">
  <div class="flex justify-between items-center mb-4">
    <h1 class="text-3xl font-semibold">AI Models</h1>
    <button mat-raised-button color="primary" (click)="openForm()">
      <mat-icon>add</mat-icon> Add model
    </button>
  </div>
  <mat-form-field appearance="outline"
    ><mat-label>Provider</mat-label
    ><mat-select
      [value]="selectedProviderId"
      (selectionChange)="providerChanged($event.value)"
      ><mat-option>All providers</mat-option
      ><mat-option *ngFor="let provider of providers" [value]="provider.id">{{
        provider.displayName
      }}</mat-option></mat-select
    ></mat-form-field
  >
  <div *ngIf="isLoading" class="py-10 text-center">Loading models…</div>
  <div *ngIf="!isLoading" class="mat-elevation-z8 rounded-lg overflow-auto">
    <table mat-table [dataSource]="models" class="w-full">
      <ng-container matColumnDef="key"
        ><th mat-header-cell *matHeaderCellDef>Key</th>
        <td mat-cell *matCellDef="let model">{{ model.key }}</td></ng-container
      ><ng-container matColumnDef="displayName"
        ><th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let model">
          {{ model.displayName }}
        </td></ng-container
      ><ng-container matColumnDef="vendorModelId"
        ><th mat-header-cell *matHeaderCellDef>Vendor model ID</th>
        <td mat-cell *matCellDef="let model">
          {{ model.vendorModelId }}
        </td></ng-container
      ><ng-container matColumnDef="mediaType"
        ><th mat-header-cell *matHeaderCellDef>Media type</th>
        <td mat-cell *matCellDef="let model">
          {{ model.mediaType }}
        </td></ng-container
      ><ng-container matColumnDef="environment"
        ><th mat-header-cell *matHeaderCellDef>Environment</th>
        <td mat-cell *matCellDef="let model">
          {{ model.environment }}
        </td></ng-container
      ><ng-container matColumnDef="priority"
        ><th mat-header-cell *matHeaderCellDef>Priority</th>
        <td mat-cell *matCellDef="let model">
          {{ model.priority }}
        </td></ng-container
      ><ng-container matColumnDef="enabled"
        ><th mat-header-cell *matHeaderCellDef>Enabled</th>
        <td mat-cell *matCellDef="let model">
          <mat-slide-toggle
            [checked]="model.enabled"
            (change)="toggle(model, $event.checked)"
          ></mat-slide-toggle></td></ng-container
      ><ng-container matColumnDef="actions"
        ><th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let model">
          <button
            mat-icon-button
            (click)="openForm(model)"
            aria-label="Edit model"
          >
            <mat-icon>edit</mat-icon></button
          ><button
            mat-icon-button
            color="warn"
            (click)="remove(model)"
            aria-label="Delete model"
          >
            <mat-icon>delete</mat-icon>
          </button>
        </td></ng-container
      >
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>
</div>
