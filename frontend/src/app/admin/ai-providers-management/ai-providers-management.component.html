<div class="p-4">
  <div class="flex justify-between items-center mb-4">
    <h1 class="text-3xl font-semibold">AI Providers</h1>
    <button mat-raised-button color="primary" (click)="openForm()">
      <mat-icon>add</mat-icon> Add provider
    </button>
  </div>
  <div *ngIf="isLoading" class="py-10 text-center">Loading providers…</div>
  <div *ngIf="!isLoading" class="mat-elevation-z8 rounded-lg overflow-auto">
    <table mat-table [dataSource]="providers" class="w-full">
      <ng-container matColumnDef="key"
        ><th mat-header-cell *matHeaderCellDef>Key</th>
        <td mat-cell *matCellDef="let provider">
          {{ provider.key }}
        </td></ng-container
      >
      <ng-container matColumnDef="displayName"
        ><th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let provider">
          {{ provider.displayName }}
        </td></ng-container
      >
      <ng-container matColumnDef="providerType"
        ><th mat-header-cell *matHeaderCellDef>Type</th>
        <td mat-cell *matCellDef="let provider">
          {{ provider.providerType }}
        </td></ng-container
      >
      <ng-container matColumnDef="enabled"
        ><th mat-header-cell *matHeaderCellDef>Enabled</th>
        <td mat-cell *matCellDef="let provider">
          <mat-slide-toggle
            [checked]="provider.enabled"
            (change)="toggle(provider, $event.checked)"
          ></mat-slide-toggle></td
      ></ng-container>
      <ng-container matColumnDef="hasSecret"
        ><th mat-header-cell *matHeaderCellDef>Secret</th>
        <td mat-cell *matCellDef="let provider">
          <span [class.text-green-600]="provider.hasSecret">{{
            provider.hasSecret ? 'Configured' : 'Missing'
          }}</span>
        </td></ng-container
      >
      <ng-container matColumnDef="actions"
        ><th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let provider">
          <button
            mat-icon-button
            (click)="openForm(provider)"
            aria-label="Edit provider"
          >
            <mat-icon>edit</mat-icon></button
          ><button
            mat-icon-button
            (click)="test(provider)"
            aria-label="Test provider"
          >
            <mat-icon>play_arrow</mat-icon></button
          ><button
            mat-icon-button
            color="warn"
            (click)="remove(provider)"
            aria-label="Delete provider"
          >
            <mat-icon>delete</mat-icon>
          </button>
        </td></ng-container
      >
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>
</div>
