<h1 mat-dialog-title>{{ provider ? 'Edit' : 'Create' }} AI Provider</h1>
<div mat-dialog-content>
  <form [formGroup]="form" class="grid gap-3 pt-2">
    <mat-form-field appearance="outline"
      ><mat-label>Key</mat-label><input matInput formControlName="key"
    /></mat-form-field>
    <mat-form-field appearance="outline"
      ><mat-label>Display name</mat-label
      ><input matInput formControlName="displayName"
    /></mat-form-field>
    <mat-form-field appearance="outline"
      ><mat-label>Provider type</mat-label
      ><mat-select formControlName="providerType"
        ><mat-option *ngFor="let type of providerTypes" [value]="type">{{
          type
        }}</mat-option></mat-select
      ></mat-form-field
    >
    <mat-form-field appearance="outline"
      ><mat-label
        >Secret reference
        {{ provider ? '(leave blank to keep)' : '' }}</mat-label
      ><input matInput type="password" formControlName="secretRef"
    /></mat-form-field>
    <mat-form-field appearance="outline"
      ><mat-label>Base URL</mat-label><input matInput formControlName="baseUrl"
    /></mat-form-field>
    <mat-form-field appearance="outline"
      ><mat-label>Timeout seconds</mat-label
      ><input matInput type="number" formControlName="timeoutSeconds"
    /></mat-form-field>
    <mat-slide-toggle formControlName="enabled">Enabled</mat-slide-toggle>
  </form>
</div>
<div mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancel</button
  ><button mat-raised-button color="primary" (click)="save()">Save</button>
</div>
